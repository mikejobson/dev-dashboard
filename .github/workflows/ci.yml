name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The scanner tests drive real git on throwaway repositories and the installer builds
        # OS-specific paths, so all three are worth running.
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DevDash.slnx

      - name: Build
        run: dotnet build DevDash.slnx -c Release --no-restore

      - name: Test
        run: dotnet test DevDash.slnx -c Release --no-build

      # The release ships self-contained single-file binaries; make sure one really starts here.
      - name: Publish the agent as a single file
        run: >
          dotnet publish src/DevDash.Agent/DevDash.Agent.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out

      - name: Smoke-test the published agent
        shell: bash
        run: |
          ./out/devdash-agent --version
          mkdir -p smoke/Developer
          git init -q smoke/Developer/widget
          ./out/devdash-agent scan --dry-run --root smoke/Developer | grep '"name": "widget"'
          ./out/devdash-agent install --dry-run --hub-url https://devdash.example.ts.net --api-key ddk_ci_smoke_test

  # The agent's self-update, for real: two published builds, a signed release folder served from
  # localhost, an install, an update (the file swap of a running program is different on every OS, and
  # on Windows two programs are swapped together), a roll back, releases that must be refused, and a
  # confirmation against a hub. Uses a throwaway signing key compiled into these test builds only.
  ota:
    name: Self-update end to end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install, update, roll back, refuse, confirm
        shell: bash
        run: scripts/test-ota.sh

  scripts:
    name: Lint scripts and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck scripts/*.sh

      # The release public key lives in the agent source and in both install scripts; they must agree.
      - name: The release public key is the same everywhere
        run: scripts/release-signing-key.sh check

      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install.ps1), [ref] $null, [ref] $errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

  hub-image:
    name: Build the hub image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
