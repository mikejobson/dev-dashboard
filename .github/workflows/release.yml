name: Release

# Push a tag like v0.2.0 to publish:
#   - agent binaries for every platform, with version.txt, checksums.txt and its signature
#     checksums.txt.sig, on a GitHub Release
#   - the hub image at ghcr.io/<owner>/dev-dashboard-hub:<version> and :latest
#
# The release is signed with the private key in the DEVDASH_RELEASE_SIGNING_KEY secret (a PEM ECDSA
# P-256 key; scripts/release-signing-key.sh generate makes one and writes its public half into the
# source). Agents only install releases signed with it, so a release without the secret, or with a
# secret that does not match the public key in the source, fails here before anything is built.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  HUB_IMAGE: ghcr.io/${{ github.repository_owner }}/dev-dashboard-hub

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version from the tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # First, because nothing below is worth doing if the release could not be signed, or would be
      # signed with a key the agents built from this commit do not trust.
      - name: Check the release signing key
        env:
          DEVDASH_RELEASE_SIGNING_KEY: ${{ secrets.DEVDASH_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$DEVDASH_RELEASE_SIGNING_KEY" ]; then
            echo "::error::The DEVDASH_RELEASE_SIGNING_KEY secret is not set. Releases must be signed: see 'Signing key' in the README."
            exit 1
          fi
          scripts/release-signing-key.sh check --require-key
          scripts/release-signing-key.sh check-private

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - run: dotnet test DevDash.slnx -c Release -p:Version=${{ steps.version.outputs.version }}

  agent:
    name: Publish agent binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # One Linux runner builds every platform: self-contained single-file publishing only needs
      # the target's prebuilt runtime pack. The verify job below runs the results on real macOS
      # and Windows before anything is released.
      - name: Publish all platforms
        run: scripts/publish-agent.sh "${{ needs.test.outputs.version }}"

      # The private key is only ever in this one step's environment. The script refuses to sign if
      # the secret is missing or is not the other half of the public key in the source.
      - name: Sign checksums.txt
        env:
          DEVDASH_RELEASE_SIGNING_KEY: ${{ secrets.DEVDASH_RELEASE_SIGNING_KEY }}
        run: scripts/release-signing-key.sh sign dist

      # verify-release is the agent's own check, run by a binary from this very build: if it passes,
      # agents of this release will accept the next one signed with the same key.
      - name: Check the Linux binary and the signature
        run: |
          mkdir check && tar -xzf dist/devdash-agent-linux-x64.tar.gz -C check
          test "$(check/devdash-agent --version)" = "devdash-agent ${{ needs.test.outputs.version }}"
          test "$(cat dist/version.txt)" = "${{ needs.test.outputs.version }}"
          test -s dist/checksums.txt.sig
          check/devdash-agent verify-release dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Run the binary on ${{ matrix.os }}
    needs: [test, agent]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: devdash-agent-osx-arm64.tar.gz
          - os: windows-latest
            asset: devdash-agent-win-x64.zip
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-dist
          path: dist

      - name: Unpack and run
        shell: bash
        run: |
          mkdir bin
          case "${{ matrix.asset }}" in
            *.zip) unzip -q "dist/${{ matrix.asset }}" -d bin ;;
            *) tar -xzf "dist/${{ matrix.asset }}" -C bin ;;
          esac
          test "$(bin/devdash-agent --version | tr -d '\r')" = "devdash-agent ${{ needs.test.outputs.version }}"
          mkdir -p smoke/Developer && git init -q smoke/Developer/widget
          bin/devdash-agent scan --dry-run --root smoke/Developer | grep '"name": "widget"'
          bin/devdash-agent install --dry-run --hub-url https://devdash.example.ts.net --api-key ddk_release_smoke_test
          # The signature must verify with this platform's crypto too.
          bin/devdash-agent verify-release dist

  hub-image:
    name: Build and push the hub image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the final stage's tiny RUN step executes as arm64; the .NET build cross-compiles natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.HUB_IMAGE }}
          # v0.2.0 -> 0.2.0 and 0.2, plus latest (skipped automatically for pre-releases).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.test.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create the GitHub Release
    needs: [test, agent, verify, hub-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-dist
          path: dist

      - name: Check the release is complete
        run: |
          for file in checksums.txt checksums.txt.sig version.txt; do
            test -s "dist/$file" || { echo "::error::dist/$file is missing; refusing to publish an unsigned release."; exit 1; }
          done
          (cd dist && sha256sum -c checksums.txt)

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          case "${{ needs.test.outputs.version }}" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "DevDash ${{ needs.test.outputs.version }}" \
            --generate-notes --verify-tag "${flags[@]}"
